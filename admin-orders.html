<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Orders — Balay Tablea Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand-logo brand-logo-sm">
      <img src="img/logo.png" alt="Balay Tablea" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none"><span class="logo-mark">BT</span></div>
    </div>
    <h1 class="topbar-title">Orders</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="shell-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo brand-logo-md">
        <img src="img/logo.png" alt="Balay Tablea" style="max-height:48px" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none">
          <span class="logo-mark">BT</span>
          <span class="logo-word">Balay <em>Tablea</em></span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-btn">Dashboard</a>
        <a href="admin-products.html" class="nav-btn">Products</a>
        <a href="admin-inventory.html" class="nav-btn">Inventory</a>
        <a href="admin-orders.html" class="nav-btn active" aria-current="page">Orders</a>
        <a href="admin-bookings.html" class="nav-btn">Visit Bookings</a>
        <a href="admin-settings.html" class="nav-btn">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <p class="sidebar-user" id="sidebarUserEmail"></p>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtnSidebar">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="panel" id="panel-orders">
        <div class="panel-header">
          <div><h2>Orders</h2><p>Track fulfillment from pending through completed.</p></div>
          <button class="btn btn-primary" id="toggleOrderFormBtn">+ New Order</button>
        </div>

        <div class="form-card glass" id="orderFormCard" hidden>
          <h3>Create an Order</h3>
          <form id="createOrderForm">
            <div class="field-row">
              <div class="field"><label for="orderNumber">Order Number</label><input id="orderNumber" required></div>
              <div class="field"><label for="orderCustomerName">Customer Name</label><input id="orderCustomerName" required></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="orderCustomerEmail">Email</label><input id="orderCustomerEmail" type="email"></div>
              <div class="field"><label for="orderCustomerPhone">Phone</label><input id="orderCustomerPhone"></div>
            </div>
            <div class="field"><label for="orderShippingAddress">Shipping Address</label><textarea id="orderShippingAddress"></textarea></div>

            <label style="display:block; font-size:.82rem; font-weight:600; color:var(--text-muted); margin-bottom:.6rem">Items</label>
            <div id="orderItemsBuilder"></div>
            <button type="button" class="btn btn-ghost btn-sm" id="addOrderItemBtn">+ Add Item</button>

            <div class="order-totals">
              <span>Items Subtotal: <strong id="orderSubtotalDisplay">&#8369;0.00</strong></span>
              <span>Shipping: <input id="orderShippingFee" type="number" min="0" step="0.01" value="0" style="width:100px; display:inline-block"></span>
              <span>Total: <b id="orderTotalDisplay">&#8369;0.00</b></span>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save Order</button>
              <button type="button" class="btn btn-ghost" id="cancelOrderFormBtn">Cancel</button>
            </div>
          </form>
        </div>

        <div class="filter-bar glass">
          <div class="field"><label for="ofSearch">Search</label><input id="ofSearch" placeholder="Order #, name, or email"></div>
          <div class="field">
            <label for="ofStatus">Status</label>
            <select id="ofStatus">
              <option value="">All</option><option value="pending">Pending</option><option value="processing">Processing</option>
              <option value="shipped">Shipped</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field"><label for="ofFrom">From</label><input id="ofFrom" type="date"></div>
          <div class="field"><label for="ofTo">To</label><input id="ofTo" type="date"></div>
          <div class="field"><label for="ofMin">Min Total</label><input id="ofMin" type="number" min="0" step="0.01"></div>
          <div class="field"><label for="ofMax">Max Total</label><input id="ofMax" type="number" min="0" step="0.01"></div>
          <div class="filter-actions"><button class="btn btn-ghost btn-sm" id="ofReset">Reset</button></div>
        </div>

        <p class="result-count" id="orderResultCount"></p>
        <div class="table-container glass">
          <table class="data-table">
            <thead><tr><th>Order #</th><th>Customer</th><th>Shipping</th><th>Total</th><th>Status</th><th>Date</th><th>Items</th></tr></thead>
            <tbody id="ordersTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-orders.js"></script>
</body>
</html>
