<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Settings — Balay Tablea Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand-logo brand-logo-sm">
      <img src="img/logo.png" alt="Balay Tablea" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none"><span class="logo-mark">BT</span></div>
    </div>
    <h1 class="topbar-title">Settings</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="shell-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo brand-logo-md">
        <img src="img/logo.png" alt="Balay Tablea" style="max-height:48px" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none">
          <span class="logo-mark">BT</span>
          <span class="logo-word">Balay <em>Tablea</em></span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-btn">Dashboard</a>
        <a href="admin-products.html" class="nav-btn">Products</a>
        <a href="admin-inventory.html" class="nav-btn">Inventory</a>
        <a href="admin-orders.html" class="nav-btn">Orders</a>
        <a href="admin-bookings.html" class="nav-btn">Visit Bookings</a>
        <a href="admin-settings.html" class="nav-btn active" aria-current="page">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <p class="sidebar-user" id="sidebarUserEmail"></p>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtnSidebar">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="panel" id="panel-settings">
        <div class="panel-header"><div><h2>System Settings</h2><p>Global variables used across the storefront and admin tools.</p></div></div>
        <div class="form-card glass" style="max-width:520px">
          <form id="settingsForm">
            <div class="field">
              <label class="switch">
                <input type="checkbox" id="setStoreOpen">
                <span class="switch-track"><span class="switch-thumb"></span></span>
                <span class="switch-label">Store is open for orders &amp; bookings</span>
              </label>
            </div>
            <div class="field"><label for="setContactEmail">Contact Email</label><input id="setContactEmail" type="email"></div>
            <div class="field"><label for="setContactPhone">Contact Phone</label><input id="setContactPhone"></div>
            <div class="field"><label for="setContactAddress">Contact Address</label><input id="setContactAddress"></div>
            <div class="field"><label for="setShippingRate">Default Flat-Rate Shipping (&#8369;)</label><input id="setShippingRate" type="number" step="0.01" min="0"></div>
            <button type="submit" class="btn btn-primary">Save Settings</button>
          </form>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-settings.js"></script>
</body>
</html>
