<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Inventory — Balay Tablea Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand-logo brand-logo-sm">
      <img src="img/logo.png" alt="Balay Tablea" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none"><span class="logo-mark">BT</span></div>
    </div>
    <h1 class="topbar-title">Inventory</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="shell-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo brand-logo-md">
        <img src="img/logo.png" alt="Balay Tablea" style="max-height:48px" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none">
          <span class="logo-mark">BT</span>
          <span class="logo-word">Balay <em>Tablea</em></span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-btn">Dashboard</a>
        <a href="admin-products.html" class="nav-btn">Products</a>
        <a href="admin-inventory.html" class="nav-btn active" aria-current="page">Inventory</a>
        <a href="admin-orders.html" class="nav-btn">Orders</a>
        <a href="admin-bookings.html" class="nav-btn">Visit Bookings</a>
        <a href="admin-settings.html" class="nav-btn">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <p class="sidebar-user" id="sidebarUserEmail"></p>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtnSidebar">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="panel" id="panel-inventory">
        <div class="panel-header"><div><h2>Inventory</h2><p>Log stock movements and keep an eye on what's running low.</p></div></div>

        <div class="panel-card glass">
          <h3>Low Stock Alerts</h3>
          <div class="mini-list" id="inventoryLowStock"></div>
        </div>

        <div class="card-grid">
          <div class="form-card glass">
            <h3>Add or Remove Stock</h3>
            <form id="inventoryForm">
              <div class="field"><label for="invProductId">Product</label><select id="invProductId" required></select></div>
              <div class="field-row">
                <div class="field"><label for="invChange">Amount (+/-)</label><input id="invChange" type="number" required placeholder="50 or -5"></div>
                <div class="field">
                  <label for="invType">Type</label>
                  <select id="invType">
                    <option value="restock">Restock</option>
                    <option value="sale">Sale</option>
                    <option value="damaged">Damaged</option>
                    <option value="correction">Correction</option>
                    <option value="return">Return</option>
                    <option value="adjustment">Adjustment</option>
                  </select>
                </div>
              </div>
              <div class="field"><label for="invReason">Reason</label><input id="invReason" required placeholder="e.g. New delivery arrived"></div>
              <button type="submit" class="btn btn-primary">Save Stock Update</button>
            </form>
          </div>
        </div>

        <div class="filter-bar glass">
          <div class="field"><label for="ifProduct">Product</label><select id="ifProduct"><option value="">All products</option></select></div>
          <div class="field">
            <label for="ifType">Type</label>
            <select id="ifType">
              <option value="">All types</option>
              <option value="restock">Restock</option><option value="sale">Sale</option><option value="damaged">Damaged</option>
              <option value="correction">Correction</option><option value="return">Return</option><option value="adjustment">Adjustment</option>
            </select>
          </div>
          <div class="field"><label for="ifOrder">Order #</label><input id="ifOrder" placeholder="e.g. 2609"></div>
          <div class="field"><label for="ifReason">Reason</label><input id="ifReason" placeholder="Search reason"></div>
          <div class="field"><label for="ifFrom">From</label><input id="ifFrom" type="date"></div>
          <div class="field"><label for="ifTo">To</label><input id="ifTo" type="date"></div>
          <div class="filter-actions"><button class="btn btn-ghost btn-sm" id="ifReset">Reset</button></div>
        </div>

        <p class="result-count" id="inventoryResultCount"></p>
        <div class="table-container glass">
          <table class="data-table">
            <thead><tr><th>Date &amp; Time</th><th>Product</th><th>Change</th><th>Type</th><th>Order</th><th>Reason</th></tr></thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-inventory.js"></script>
</body>
</html>
