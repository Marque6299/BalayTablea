<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Products — Balay Tablea Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand-logo brand-logo-sm">
      <img src="img/logo.png" alt="Balay Tablea" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none"><span class="logo-mark">BT</span></div>
    </div>
    <h1 class="topbar-title">Products</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="shell-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo brand-logo-md">
        <img src="img/logo.png" alt="Balay Tablea" style="max-height:48px" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none">
          <span class="logo-mark">BT</span>
          <span class="logo-word">Balay <em>Tablea</em></span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-btn">Dashboard</a>
        <a href="admin-products.html" class="nav-btn active" aria-current="page">Products</a>
        <a href="admin-inventory.html" class="nav-btn">Inventory</a>
        <a href="admin-orders.html" class="nav-btn">Orders</a>
        <a href="admin-bookings.html" class="nav-btn">Visit Bookings</a>
        <a href="admin-settings.html" class="nav-btn">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <p class="sidebar-user" id="sidebarUserEmail"></p>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtnSidebar">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="panel" id="panel-products">
        <div class="panel-header">
          <div><h2>Products</h2><p>Manage your catalog, pricing, categories, and stock status.</p></div>
        </div>

        <div class="card-grid">
          <div class="form-card glass">
            <h3 id="productFormTitle">Add a Product</h3>
            <form id="productForm">
              <input type="hidden" id="prodId">
              <div class="field"><label for="prodName">Product Name</label><input id="prodName" required></div>
              <div class="field-row">
                <div class="field"><label for="prodSlug">Web Link (no spaces)</label><input id="prodSlug" placeholder="tablea-rolls-500g" required></div>
                <div class="field">
                  <label for="prodCategory">Category</label>
                  <input id="prodCategory" list="categoryList" placeholder="e.g. Tablea Rolls">
                  <datalist id="categoryList"></datalist>
                </div>
              </div>
              <div class="field"><label for="prodImage">Image Link</label><input id="prodImage" placeholder="https://your-image-link.com/img.jpg"></div>
              <div class="field-row">
                <div class="field"><label for="prodPrice">Price (&#8369;)</label><input id="prodPrice" type="number" step="0.01" min="0" required></div>
                <div class="field"><label for="prodStock">Current Stock</label><input id="prodStock" type="number" min="0" required></div>
              </div>
              <div class="field"><label for="prodThreshold">Low-Stock Threshold</label><input id="prodThreshold" type="number" min="0" value="5"></div>
              <div class="field">
                <label>Status</label>
                <div class="segmented" id="prodStatusSeg">
                  <button type="button" class="seg-btn active" data-value="draft">Draft</button>
                  <button type="button" class="seg-btn" data-value="active">Active</button>
                  <button type="button" class="seg-btn" data-value="archived">Archived</button>
                </div>
                <input type="hidden" id="prodStatus" value="draft">
              </div>
              <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Product</button>
                <button type="button" class="btn btn-ghost" id="prodResetBtn">Clear</button>
              </div>
            </form>
          </div>
        </div>

        <div class="filter-bar glass">
          <div class="field"><label for="pfName">Name</label><input id="pfName" placeholder="Search name or link"></div>
          <div class="field"><label for="pfCategory">Category</label><select id="pfCategory"><option value="">All</option></select></div>
          <div class="field"><label for="pfStatus">Status</label><select id="pfStatus"><option value="">All</option><option value="draft">Draft</option><option value="active">Active</option><option value="archived">Archived</option></select></div>
          <div class="field"><label for="pfStock">Stock</label><select id="pfStock"><option value="">All</option><option value="low">Low stock only</option><option value="out">Out of stock</option></select></div>
          <div class="field"><label for="pfPriceMin">Min &#8369;</label><input id="pfPriceMin" type="number" min="0" step="0.01"></div>
          <div class="field"><label for="pfPriceMax">Max &#8369;</label><input id="pfPriceMax" type="number" min="0" step="0.01"></div>
          <div class="filter-actions"><button class="btn btn-ghost btn-sm" id="pfReset">Reset</button></div>
        </div>

        <div class="bulk-bar glass" id="bulkBar" hidden>
          <strong id="bulkCount">0 selected</strong>
          <select id="bulkMode"><option value="increase">Increase</option><option value="decrease">Decrease</option></select>
          <select id="bulkType"><option value="percent">by %</option><option value="fixed">by &#8369;</option></select>
          <input id="bulkAmount" type="number" min="0" step="0.01" placeholder="Amount">
          <button class="btn btn-primary btn-sm" id="bulkApplyBtn">Apply to Selected</button>
          <button class="btn btn-ghost btn-sm" id="bulkClearBtn">Clear Selection</button>
        </div>

        <p class="result-count" id="productResultCount"></p>
        <div class="table-container glass">
          <table class="data-table">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAllProducts"></th>
                <th>Image</th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-products.js"></script>
</body>
</html>
