<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Visit Bookings — Balay Tablea Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%AB%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="app-shell">
  <header class="topbar">
    <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu">&#9776;</button>
    <div class="brand-logo brand-logo-sm">
      <img src="img/logo.png" alt="Balay Tablea" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="logo-fallback" style="display:none"><span class="logo-mark">BT</span></div>
    </div>
    <h1 class="topbar-title">Visit Bookings</h1>
    <div class="topbar-right">
      <span class="topbar-user" id="userEmail"></span>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Log Out</button>
    </div>
  </header>

  <div class="shell-body">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand-logo brand-logo-md">
        <img src="img/logo.png" alt="Balay Tablea" style="max-height:48px" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none">
          <span class="logo-mark">BT</span>
          <span class="logo-word">Balay <em>Tablea</em></span>
        </div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-btn">Dashboard</a>
        <a href="admin-products.html" class="nav-btn">Products</a>
        <a href="admin-inventory.html" class="nav-btn">Inventory</a>
        <a href="admin-orders.html" class="nav-btn">Orders</a>
        <a href="admin-bookings.html" class="nav-btn active" aria-current="page">Visit Bookings</a>
        <a href="admin-settings.html" class="nav-btn">Settings</a>
      </nav>
      <div class="sidebar-footer">
        <p class="sidebar-user" id="sidebarUserEmail"></p>
        <button class="btn btn-ghost btn-block btn-sm" id="logoutBtnSidebar">Log Out</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="panel" id="panel-bookings">
        <div class="panel-header"><div><h2>Visit Bookings</h2><p>Farm and shop tour requests from visit.html — or added here by phone.</p></div></div>

        <div class="card-grid">
          <div class="form-card glass">
            <h3>Add a Booking</h3>
            <form id="bookingForm">
              <div class="field"><label for="bkName">Visitor Name</label><input id="bkName" required></div>
              <div class="field-row">
                <div class="field"><label for="bkEmail">Email</label><input id="bkEmail" type="email"></div>
                <div class="field"><label for="bkPhone">Phone</label><input id="bkPhone"></div>
              </div>
              <div class="field-row">
                <div class="field"><label for="bkDate">Visit Date</label><input id="bkDate" type="date" required></div>
                <div class="field"><label for="bkTime">Time Slot</label><input id="bkTime" placeholder="Morning (9-11 AM)"></div>
              </div>
              <div class="field-row">
                <div class="field"><label for="bkPax">Pax</label><input id="bkPax" type="number" min="1" value="1" required></div>
                <div class="field">
                  <label for="bkType">Visit Type</label>
                  <select id="bkType"><option value="workshop">Workshop</option><option value="farm_visit">Farm Visit</option><option value="both">Both</option></select>
                </div>
              </div>
              <div class="field"><label for="bkNotes">Visitor Notes</label><textarea id="bkNotes" placeholder="Anything they mentioned"></textarea></div>
              <button type="submit" class="btn btn-primary">Save Booking</button>
            </form>
          </div>
        </div>

        <div class="filter-bar glass">
          <div class="field"><label for="bfSearch">Visitor</label><input id="bfSearch" placeholder="Search name"></div>
          <div class="field">
            <label for="bfType">Type</label>
            <select id="bfType"><option value="">All</option><option value="workshop">Workshop</option><option value="farm_visit">Farm Visit</option><option value="both">Both</option></select>
          </div>
          <div class="field">
            <label for="bfStatus">Status</label>
            <select id="bfStatus">
              <option value="">All</option><option value="pending">Pending</option><option value="approved">Approved</option>
              <option value="completed">Completed</option><option value="declined">Declined</option><option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="field"><label for="bfFrom">From</label><input id="bfFrom" type="date"></div>
          <div class="field"><label for="bfTo">To</label><input id="bfTo" type="date"></div>
          <div class="filter-actions"><button class="btn btn-ghost btn-sm" id="bfReset">Reset</button></div>
        </div>

        <p class="result-count" id="bookingResultCount"></p>
        <div class="table-container glass">
          <table class="data-table">
            <thead><tr><th>Visitor</th><th>Visit Date</th><th>Pax</th><th>Type</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="bookingsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="icon-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="js/admin-common.js"></script>
<script src="js/admin-bookings.js"></script>
</body>
</html>
